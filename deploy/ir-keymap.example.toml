# Example ir-keytable keymap for a generic NEC remote.
# 1. Find your remote's scancodes:  sudo ir-keytable -c -p all -t   (press buttons, note "scancode = 0x...")
# 2. Replace the scancodes below, save as /etc/rc_keymaps/officeboard.toml
# 3. Load it:  sudo ir-keytable -c -w /etc/rc_keymaps/officeboard.toml
#    and persist it by adding this line to /etc/rc_maps.cfg:
#      *  *  /etc/rc_keymaps/officeboard.toml
[[protocols]]
name = "officeboard"
protocol = "nec"
[protocols.scancodes]
0x45 = "KEY_POWER"
0x46 = "KEY_UP"
0x15 = "KEY_DOWN"
0x44 = "KEY_LEFT"
0x43 = "KEY_RIGHT"
0x40 = "KEY_OK"
0x07 = "KEY_BACK"
0x09 = "KEY_HOME"
0x16 = "KEY_PLAYPAUSE"
0x19 = "KEY_P"
0x0d = "KEY_INFO"
0x0c = "KEY_1"
0x18 = "KEY_2"
0x5e = "KEY_3"
0x08 = "KEY_4"
0x1c = "KEY_5"
0x5a = "KEY_6"
0x42 = "KEY_7"
0x52 = "KEY_8"
0x4a = "KEY_9"
