# Only needed for a locally-managed tunnel (Option B in deploy/README.md).
# Copy to /etc/cloudflared/config.yml and fill in your tunnel ID and hostname.
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/00000000-0000-0000-0000-000000000000.json

ingress:
  - hostname: board.example.com
    service: http://localhost:8080
  - service: http_status:404
